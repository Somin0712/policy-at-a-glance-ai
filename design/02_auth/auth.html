<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>로그인 - 정책한눈에 AI</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#2563eb",

                    "on-surface-variant": "#434655",
                    "surface-container-highest": "#e0e3e5",
                    "inverse-surface": "#2d3133",
                    "surface": "#f7f9fb",
                    "inverse-primary": "#b4c5ff",
                    "primary": "#004ac6",
                    "surface-container": "#eceef0",
                    "on-tertiary-fixed-variant": "#004395",
                    "background": "#f7f9fb",
                    "surface-container-low": "#f2f4f6",
                    "inverse-on-surface": "#eff1f3",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#edf0ff",
                    "on-surface": "#191c1e",
                    "surface-container-lowest": "#ffffff",

                    "on-secondary-fixed-variant": "#3c475a",
                    "on-error-container": "#93000a",
                    "surface-tint": "#0053db",

                    "on-tertiary-fixed": "#001a42",
                    "secondary": "#545f73",
                    "on-secondary-fixed": "#111c2d",
                    "surface-variant": "#e0e3e5",
                    "secondary-container": "#d5e0f8",
                    "on-background": "#191c1e",

            "spacing": {

                    "base": "4px",
                    "gutter": "24px",

                    "xs": "4px",
                    "xl": "40px"
            },
            "fontFamily": {
                    "body-lg": ["Hanken Grotesk"],
                    "label-md": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],

                    "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500"}]

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-gutter antialiased relative overflow-hidden">
<!-- Ambient UI background element for 'AI' feel -->
<div class="absolute inset-0 pointer-events-none flex justify-center items-center opacity-40 z-0">
<div class="w-[600px] h-[600px] bg-primary-fixed rounded-full blur-[100px] absolute -top-40 -left-40"></div>
<div class="w-[800px] h-[800px] bg-tertiary-fixed rounded-full blur-[120px] absolute -bottom-60 -right-20"></div>
</div>
<!-- Login Card Surface (Level 1) -->
<div class="w-full max-w-[480px] bg-surface-container-lowest border border-surface-variant shadow-sm rounded-xl p-lg md:p-xl z-10 relative">
<!-- Brand Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-primary-container text-on-primary-container mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="policy" data-weight="fill" style="font-variation-settings: 'FILL' 1;">policy</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-sm">정책한눈에 AI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">로그인하면 관심 정책과 생성한 설명 글을 저장할 수 있습니다.</p>
</div>
<!-- Form Area -->
<form class="space-y-md">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">이메일</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">비밀번호</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Login Actions -->
<div class="pt-sm flex flex-col gap-sm">
<button class="w-full py-3 px-4 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:opacity-90 transition-opacity flex justify-center items-center gap-2" type="submit">
<span class="material-symbols-outlined text-[20px]" data-icon="login">login</span>
                    로그인
                </button>
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-outline font-label-sm text-label-sm uppercase tracking-wider">또는</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full py-3 px-4 bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md rounded-lg hover:bg-surface-container-low transition-colors flex justify-center items-center gap-2" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google 계정으로 로그인
                </button>
</div>
</form>
<!-- Footer / Signup Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                계정이 없으신가요? 
                <a class="font-label-md text-label-md text-primary hover:underline underline-offset-4 ml-1" href="#">회원가입</a>
</p>
</div>
</div>
</body></html>
